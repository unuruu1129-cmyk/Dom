<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[1240px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 03</span>
      </header>

      <div class="flex flex-1 justify-center py-10">
        <main class="flex flex-col px-25">
          <header class="w-310 h-26 flex flex-row justify-between">
            <div>
              <div class="text-3xl text-[#F4F4F5] font-semibold">Color palettes.</div>
              <div class="text-sm text-[#A1A1AA] mt-3 font-light">Generated shades with Tailwind color names. Click a shade to copy its HEX background color.</div>
            </div>
            <button type="button" id="shuffle-colors" class="h-12 w-[186px] flex flex-row justify-center items-center rounded-2xl bg-[#D9F99D] text-[#09090B] text-sm font-semibold">
              <div>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-refresh-cw preview-icon"
                >
                  <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                  <path d="M21 3v5h-5" />
                  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                  <path d="M8 16H3v5" />
                </svg>
              </div>
              <div class="pl-2">Shuffle palettes</div>
            </button>
          </header>
          <div class="h-[55px] flex flex-row justify-between items-center text-xs text-[#A1A1AA] font-medium">
            <div>100 → 950 · LIGHT TO DARK</div>
            <div id="status">Ready to explore.</div>
          </div>
          <section id="colors" class="space-y-7"></section>
        </main>
      </div>
    </div>
  </body>
</html>
