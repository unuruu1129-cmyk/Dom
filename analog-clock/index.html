<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>Analog Clock · A moment in time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
  <body class="relative isolate min-h-screen min-w-[1000px] bg-[#f5f3ee] font-sans text-[#253b35] antialiased selection:bg-[#dbe4d6]">
    <div class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(ellipse_at_50%_45%,#ffffff_0%,#f5f3ee_65%)]"></div>
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#253b35]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#253b35]/10 bg-white/60 px-4 py-2.5 text-xs font-medium text-[#52675c] transition-colors hover:border-[#253b35]/25 hover:bg-white hover:text-[#253b35] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#52675c]"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#748174]">The everyday collection / 05</span>
      </header>

      <div class="flex flex-col flex-1 items-center justify-center py-10 bg-[#F5F3EE]">
        <div class="text-xs text-[#7B887C] pb-8 font-semibold tracking-widest">A MOMENT IN TIME</div>
        <div class="relative aspect-square w-[360px] border-[16px] border-[#D8DBD1] rounded-full bg-[#FCFBF7]">
          <div id="markers" class="absolute inset-0"></div>
          <div id="numbers" class="absolute inset-0 font-serif text-xl sm:text-2xl"></div>
          <div id="hour-hand" class="absolute bottom-1/2 -translate-x-1/2 left-1/2 z-10 h-[27%] w-[7px] origin-bottom bg-[#253B35] rounded-xl"></div>
          <div id="minute-hand" class="absolute bottom-1/2 -translate-x-1/2 left-1/2 z-20 h-[34%] w-[4px] origin-bottom bg-[#253B35] rounded-xl"></div>
          <div id="second-hand" class="absolute bottom-1/2 left-1/2 z-30 h-[39%] w-[2px] -translate-x-1/2 origin-bottom rounded-full bg-[#C47E57]">
            <div class="absolute top-full left-0 h-[24px] w-full rounded-full bg-[#C47E57]"></div>
          </div>
          <div class="absolute left-1/2 top-1/2 z-40 h-[16px] w-[16px] -translate-x-1/2 -translate-y-1/2 rounded-full border-[4px] border-[#FCFBF7] bg-[#C47E57]"></div>
          <div class="absolute left-1/2 top-[28%] -translate-x-1/2 text-[9px] text-[#8F998A] font-semibold tracking-widest">SWISS</div>
        </div>
        <div class="h-8 w-44 flex flex-row justify-between items-center border border-gray-300 rounded-2xl px-4 text-xs text-[#7B887C] font-semibold mt-8 tracking-widest">
          <div class="h-1.5 w-1.5 border rounded-full bg-[#657666]"></div>
          YOUR LOCAL TIME
        </div>
      </div>

      <footer class="flex h-16 shrink-0 items-center justify-between border-t border-[#253b35]/10 text-[10px] text-[#748174]">
        <span>Every second, thoughtfully measured.</span><span class="font-mono tracking-[2px]">ANALOG / LIVE</span>
      </footer>
    </div>
  </body>
</html>
